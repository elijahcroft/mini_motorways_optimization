[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimotor"
version = "1.0.0"
description = "Plans optimal road layouts for Mini Motorways boards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pillow>=11.0"]

[project.optional-dependencies]
capture = ["pyautogui>=0.9.54"]
dev = ["ruff>=0.6", "mypy>=1.11"]

[tool.setuptools]
py-modules = ["board", "solver", "render", "vision", "main", "benchmark"]

[project.scripts]
minimotor = "main:main"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG002"]

[tool.mypy]
python_version = "3.12"
files = ["board.py", "solver.py", "render.py", "vision.py", "main.py", "benchmark.py"]
ignore_missing_imports = true
warn_unused_ignores = true
