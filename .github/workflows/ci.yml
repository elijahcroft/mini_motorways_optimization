name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: python -m unittest discover -s tests -v
      # smoke test: the solver has to survive the real sample boards,
      # which the unit tests only approximate with small ascii ones
      - run: python benchmark.py boards/riverside.json boards/twin_rivers.json
